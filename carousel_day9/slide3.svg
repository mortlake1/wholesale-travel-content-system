<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#0F2438"/><rect x="92" y="116" width="64" height="8" fill="#C8922A"/><text x="92" y="150" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#C8922A">SLIDE 3  ·  WHAT IT IS NOT</text><text x="92" y="268" font-family="DejaVu Sans" font-size="58" font-weight="bold" fill="#FFFFFF">Three things this</text><text x="92" y="342" font-family="DejaVu Sans" font-size="58" font-weight="bold" fill="#FFFFFF">will never be.</text><path d="M 92 436 l 20 20 M 112 436 l -20 20" stroke="#E58E7A" stroke-width="6" stroke-linecap="round" fill="none"/><text x="132" y="462" font-family="DejaVu Sans" font-size="34" fill="#E8EEF2">A guaranteed income. Nobody can</text><text x="132" y="512" font-family="DejaVu Sans" font-size="34" fill="#E8EEF2">promise you an earnings figure</text><text x="132" y="562" font-family="DejaVu Sans" font-size="34" fill="#E8EEF2">— including me.</text><path d="M 92 620 l 20 20 M 112 620 l -20 20" stroke="#E58E7A" stroke-width="6" stroke-linecap="round" fill="none"/><text x="132" y="646" font-family="DejaVu Sans" font-size="34" fill="#E8EEF2">Getting paid to recruit. Commissions</text><text x="132" y="696" font-family="DejaVu Sans" font-size="34" fill="#E8EEF2">come from travel bookings, not</text><text x="132" y="746" font-family="DejaVu Sans" font-size="34" fill="#E8EEF2">from signing people up.</text><path d="M 92 804 l 20 20 M 112 804 l -20 20" stroke="#E58E7A" stroke-width="6" stroke-linecap="round" fill="none"/><text x="132" y="830" font-family="DejaVu Sans" font-size="34" fill="#E8EEF2">Something that runs without you.</text><text x="132" y="880" font-family="DejaVu Sans" font-size="34" fill="#E8EEF2">Your results depend entirely on</text><text x="132" y="930" font-family="DejaVu Sans" font-size="34" fill="#E8EEF2">the customers you build.</text><text x="92" y="1200" font-family="DejaVu Sans" font-size="26" fill="#9FB6C2">wholesale travel, explained plainly</text><text x="92" y="1266" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#9FB6C2">@yourhandle</text><circle cx="762" cy="1258" r="9" fill="#3E5566"/><circle cx="796" cy="1258" r="9" fill="#3E5566"/><circle cx="830" cy="1258" r="9" fill="#C8922A"/><circle cx="864" cy="1258" r="9" fill="#3E5566"/><circle cx="898" cy="1258" r="9" fill="#3E5566"/><circle cx="932" cy="1258" r="9" fill="#3E5566"/><circle cx="966" cy="1258" r="9" fill="#3E5566"/></svg>