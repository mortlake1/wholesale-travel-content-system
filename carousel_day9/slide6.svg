<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#F7F3EC"/><rect x="92" y="116" width="64" height="8" fill="#C8922A"/><text x="92" y="150" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#0E7C7B">SLIDE 6  ·  THE DISCLOSURE</text><text x="92" y="268" font-family="DejaVu Sans" font-size="58" font-weight="bold" fill="#14283A">Read this before anyone</text><text x="92" y="342" font-family="DejaVu Sans" font-size="58" font-weight="bold" fill="#14283A">signs anything.</text><text x="92" y="452" font-family="DejaVu Sans" font-size="34" fill="#33454F">Commission is earned only when real</text><text x="92" y="504" font-family="DejaVu Sans" font-size="34" fill="#33454F">travellers book real holidays. What</text><text x="92" y="556" font-family="DejaVu Sans" font-size="34" fill="#33454F">anyone earns depends entirely on the</text><text x="92" y="608" font-family="DejaVu Sans" font-size="34" fill="#33454F">customers they build.</text><text x="92" y="712" font-family="DejaVu Sans" font-size="34" fill="#33454F">So treat any specific income figure</text><text x="92" y="764" font-family="DejaVu Sans" font-size="34" fill="#33454F">— from me or anyone else — as one</text><text x="92" y="816" font-family="DejaVu Sans" font-size="34" fill="#33454F">person's story, not a promise.</text><rect x="92" y="908" width="896" height="190" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="3" rx="14"/><text x="128" y="974" font-family="DejaVu Sans" font-size="31" font-weight="bold" fill="#14283A">Company: {registered name}</text><text x="128" y="1020" font-family="DejaVu Sans" font-size="31" fill="#5A6B75">Reg. no {number} — ask me for the certificate</text><text x="128" y="1064" font-family="DejaVu Sans" font-size="31" fill="#5A6B75">and the compensation policy. One message, both docs.</text><text x="92" y="1200" font-family="DejaVu Sans" font-size="26" fill="#5A6B75">wholesale travel, explained plainly</text><text x="92" y="1266" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#5A6B75">@yourhandle</text><circle cx="762" cy="1258" r="9" fill="#D8D2C6"/><circle cx="796" cy="1258" r="9" fill="#D8D2C6"/><circle cx="830" cy="1258" r="9" fill="#D8D2C6"/><circle cx="864" cy="1258" r="9" fill="#D8D2C6"/><circle cx="898" cy="1258" r="9" fill="#D8D2C6"/><circle cx="932" cy="1258" r="9" fill="#C8922A"/><circle cx="966" cy="1258" r="9" fill="#D8D2C6"/></svg>