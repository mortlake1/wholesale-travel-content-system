<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#F7F3EC"/><rect x="92" y="116" width="64" height="8" fill="#C8922A"/><text x="92" y="150" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#0E7C7B">SLIDE 2  ·  WHAT IT IS</text><text x="92" y="268" font-family="DejaVu Sans" font-size="58" font-weight="bold" fill="#14283A">You introduce travellers.</text><text x="92" y="342" font-family="DejaVu Sans" font-size="58" font-weight="bold" fill="#14283A">The company pays</text><text x="92" y="416" font-family="DejaVu Sans" font-size="58" font-weight="bold" fill="#14283A">the commission.</text><circle cx="100" cy="519" r="7" fill="#0E7C7B"/><text x="132" y="530" font-family="DejaVu Sans" font-size="34" fill="#33454F">You show people contracted hotel and</text><text x="132" y="580" font-family="DejaVu Sans" font-size="34" fill="#33454F">resort rates they can't see on the</text><text x="132" y="630" font-family="DejaVu Sans" font-size="34" fill="#33454F">public booking sites.</text><circle cx="100" cy="703" r="7" fill="#0E7C7B"/><text x="132" y="714" font-family="DejaVu Sans" font-size="34" fill="#33454F">When one of them books a real trip,</text><text x="132" y="764" font-family="DejaVu Sans" font-size="34" fill="#33454F">you're paid a commission on</text><text x="132" y="814" font-family="DejaVu Sans" font-size="34" fill="#33454F">that booking.</text><circle cx="100" cy="887" r="7" fill="#0E7C7B"/><text x="132" y="898" font-family="DejaVu Sans" font-size="34" fill="#33454F">That's the mechanism. There's a</text><text x="132" y="948" font-family="DejaVu Sans" font-size="34" fill="#33454F">booking confirmation behind</text><text x="132" y="998" font-family="DejaVu Sans" font-size="34" fill="#33454F">every rand.</text><text x="92" y="1200" font-family="DejaVu Sans" font-size="26" fill="#5A6B75">wholesale travel, explained plainly</text><text x="92" y="1266" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#5A6B75">@yourhandle</text><circle cx="762" cy="1258" r="9" fill="#D8D2C6"/><circle cx="796" cy="1258" r="9" fill="#C8922A"/><circle cx="830" cy="1258" r="9" fill="#D8D2C6"/><circle cx="864" cy="1258" r="9" fill="#D8D2C6"/><circle cx="898" cy="1258" r="9" fill="#D8D2C6"/><circle cx="932" cy="1258" r="9" fill="#D8D2C6"/><circle cx="966" cy="1258" r="9" fill="#D8D2C6"/></svg>