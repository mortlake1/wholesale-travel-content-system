<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#F7F3EC"/><rect x="92" y="116" width="64" height="8" fill="#C8922A"/><text x="92" y="150" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#0E7C7B">SLIDE 4  ·  WHAT IT COSTS</text><text x="92" y="268" font-family="DejaVu Sans" font-size="64" font-weight="bold" fill="#14283A">The fee, out loud.</text><rect x="92" y="395" width="896" height="330" fill="#FFFFFF" stroke="#C8922A" stroke-width="3" stroke-dasharray="12 9" rx="14"/><text x="128" y="469" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#14283A">Joining fee</text><text x="952" y="469" font-family="DejaVu Sans" font-size="32" fill="#5A6B75" text-anchor="end">R{joining}, once</text><text x="128" y="535" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#14283A">Ongoing</text><text x="952" y="535" font-family="DejaVu Sans" font-size="32" fill="#5A6B75" text-anchor="end">R{monthly} per month</text><text x="128" y="601" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#14283A">Included</text><text x="952" y="601" font-family="DejaVu Sans" font-size="32" fill="#5A6B75" text-anchor="end">portal, contracted rates,</text><text x="952" y="667" font-family="DejaVu Sans" font-size="32" fill="#5A6B75" text-anchor="end">training and support</text><rect x="92" y="785" width="10" height="118" fill="#0E7C7B"/><text x="132" y="827" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#14283A">No obligation to book anything.</text><text x="132" y="881" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#14283A">No obligation to invite anyone.</text><text x="92" y="1104" font-family="DejaVu Sans" font-size="26" fill="#5A6B75">Replace these placeholders with your company’s</text><text x="92" y="1142" font-family="DejaVu Sans" font-size="26" fill="#5A6B75">current fee schedule before this goes live.</text><text x="92" y="1200" font-family="DejaVu Sans" font-size="26" fill="#5A6B75">wholesale travel, explained plainly</text><text x="92" y="1266" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#5A6B75">@yourhandle</text><circle cx="762" cy="1258" r="9" fill="#D8D2C6"/><circle cx="796" cy="1258" r="9" fill="#D8D2C6"/><circle cx="830" cy="1258" r="9" fill="#D8D2C6"/><circle cx="864" cy="1258" r="9" fill="#C8922A"/><circle cx="898" cy="1258" r="9" fill="#D8D2C6"/><circle cx="932" cy="1258" r="9" fill="#D8D2C6"/><circle cx="966" cy="1258" r="9" fill="#D8D2C6"/></svg>