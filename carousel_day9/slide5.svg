<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#F7F3EC"/><rect x="92" y="116" width="64" height="8" fill="#C8922A"/><text x="92" y="150" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#0E7C7B">SLIDE 5  ·  THE HONEST FIT</text><text x="92" y="268" font-family="DejaVu Sans" font-size="58" font-weight="bold" fill="#14283A">Who it suits.</text><text x="92" y="342" font-family="DejaVu Sans" font-size="58" font-weight="bold" fill="#14283A">Who it doesn't.</text><text x="92" y="446" font-family="DejaVu Sans" font-size="36" font-weight="bold" fill="#0E7C7B">Suits you if:</text><circle cx="100" cy="491" r="7" fill="#0E7C7B"/><text x="132" y="502" font-family="DejaVu Sans" font-size="33" fill="#33454F">you already love planning travel</text><circle cx="100" cy="565" r="7" fill="#0E7C7B"/><text x="132" y="576" font-family="DejaVu Sans" font-size="33" fill="#33454F">you're happy to talk to people about it</text><circle cx="100" cy="639" r="7" fill="#0E7C7B"/><text x="132" y="650" font-family="DejaVu Sans" font-size="33" fill="#33454F">you want a side build, not a salary</text><circle cx="100" cy="713" r="7" fill="#0E7C7B"/><text x="132" y="724" font-family="DejaVu Sans" font-size="33" fill="#33454F">you can handle “no” without quitting</text><text x="92" y="806" font-family="DejaVu Sans" font-size="36" font-weight="bold" fill="#A93226">Wrong fit if:</text><circle cx="100" cy="851" r="7" fill="#0E7C7B"/><text x="132" y="862" font-family="DejaVu Sans" font-size="33" fill="#33454F">you need money this month</text><circle cx="100" cy="925" r="7" fill="#0E7C7B"/><text x="132" y="936" font-family="DejaVu Sans" font-size="33" fill="#33454F">you want it to run itself</text><circle cx="100" cy="999" r="7" fill="#0E7C7B"/><text x="132" y="1010" font-family="DejaVu Sans" font-size="33" fill="#33454F">you won't tell anyone about it</text><circle cx="100" cy="1073" r="7" fill="#0E7C7B"/><text x="132" y="1084" font-family="DejaVu Sans" font-size="33" fill="#33454F">you only want the savings — join as a</text><text x="132" y="1124" font-family="DejaVu Sans" font-size="33" fill="#33454F">customer instead. Genuinely fine.</text><text x="92" y="1200" font-family="DejaVu Sans" font-size="26" fill="#5A6B75">wholesale travel, explained plainly</text><text x="92" y="1266" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#5A6B75">@yourhandle</text><circle cx="762" cy="1258" r="9" fill="#D8D2C6"/><circle cx="796" cy="1258" r="9" fill="#D8D2C6"/><circle cx="830" cy="1258" r="9" fill="#D8D2C6"/><circle cx="864" cy="1258" r="9" fill="#D8D2C6"/><circle cx="898" cy="1258" r="9" fill="#C8922A"/><circle cx="932" cy="1258" r="9" fill="#D8D2C6"/><circle cx="966" cy="1258" r="9" fill="#D8D2C6"/></svg>